<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>EscalApp — Tu WhatsApp toma los pedidos solo, 24 horas</title>
  <base href="/">
  <!-- El tema de la landing (claro por defecto, oscuro si el visitante lo eligió). Va ANTES del primer
       pintado para que quien lo eligió oscuro no vea un destello claro. `?tema=oscuro` o `?tema=claro`
       en el enlace lo fija PARA ESA VISITA (no toca lo que el visitante tiene guardado): sirve para
       compartir la página ya en el tema que se quiere enseñar. Mismo `try` que el servicio: sin almacenamiento, la página sigue y solo no recuerda. -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('tema');
        var oscuro = q ? q === 'oscuro' : localStorage.getItem('escalapp-tema') === 'oscuro';
        if (oscuro) document.documentElement.setAttribute('data-tema', 'oscuro');
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Metadatos de respaldo.
       Las rutas prerenderizadas los sobrescriben en el build con los suyos (`SeoService`); estos
       son los que quedan en las que se renderizan en el navegador. Hasta el 2026-10-20 no había
       ninguno: pegar el enlace en WhatsApp daba una URL pelada, sin título ni imagen, que es la
       peor forma de que te recomienden. -->
  <meta name="description" content="El asistente de IA contesta tu WhatsApp, toma el pedido y lo deja en tu sistema: caja, cocina, inventario y facturación DIAN en un solo lugar. Prueba 30 días gratis.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EscalApp">
  <meta property="og:locale" content="es_CO">
  <meta property="og:title" content="EscalApp — Tu WhatsApp toma los pedidos solo, 24 horas">
  <meta property="og:description" content="El asistente de IA contesta, toma el pedido y lo deja en tu sistema. Caja, cocina, inventario y facturación DIAN en un solo lugar.">
  <meta property="og:url" content="https://escalapp.cloud/">
  <meta property="og:image" content="https://escalapp.cloud/images/og-escalapp-marca.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="EscalApp — Tu WhatsApp toma los pedidos solo, 24 horas">
  <meta name="twitter:description" content="El asistente de IA contesta, toma el pedido y lo deja en tu sistema. Caja, cocina, inventario y facturación DIAN en un solo lugar.">
  <meta name="twitter:image" content="https://escalapp.cloud/images/og-escalapp-marca.png">
  <!-- Inter.
       Los DOS sistemas de tokens la declaran primera —`--es-font-sans` en tokens.css y
       `--font-family` en _theme.scss— pero no se cargaba en ninguna parte, así que todo
       caía al siguiente de la lista: Segoe UI en Windows, San Francisco en Mac, Roboto en
       Android. La marca se veía distinta en cada máquina, y de ahí la sensación de que el
       nombre cambiaba de fuente entre unas pantallas y otras. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <!-- Icono de marca.
       Las rutas van SIN barra inicial a propósito: se resuelven contra el <base href>,
       que el build reescribe a /admin/, /restaurante/ o /reserva/ según la app. Con
       "/images/icono.png" el navegador las pedía a la raíz del dominio, donde no están. -->
  <!-- favicon.svg es el del kit del diseñador (símbolo a color sobre azul noche): nítido a
       cualquier tamaño. Los navegadores que lo entienden lo prefieren; el .ico queda de respaldo.
       Sin los PNG de 16/32 a propósito: Chrome los escoge antes que el SVG si están. -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#4338CA">
  <!-- Nombre bajo el icono al añadir a la pantalla de inicio en iOS. -->
  <meta name="apple-mobile-web-app-title" content="EscalApp">
</head>
<body>
  <app-root></app-root>
</body>
</html>
